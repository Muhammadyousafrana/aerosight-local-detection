<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AeroSight local vision pipeline</title>
  <desc id="desc">Video or webcam frames flow through a local Python inference service to a browser detection overlay. Nothing is sent to the cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/><stop offset="1" stop-color="#101B2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42E8C4"/><stop offset="1" stop-color="#7BA7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="68" r="100" fill="#42E8C4" opacity=".06"/>
  <circle cx="1040" cy="320" r="130" fill="#7BA7FF" opacity=".05"/>
  <text x="56" y="82" fill="#F2F7FF" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">AeroSight</text>
  <text x="56" y="116" fill="#AAB8CA" font-family="Segoe UI,Arial,sans-serif" font-size="17">LOCAL VIDEO &amp; WEBCAM DETECTION</text>
  <rect x="56" y="151" width="136" height="28" rx="14" fill="#14352F"/>
  <circle cx="72" cy="165" r="4" fill="#42E8C4"/>
  <text x="84" y="170" fill="#8FF3DB" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1">ON DEVICE</text>

  <!-- Local-only pipeline cards -->
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="58" y="220" width="225" height="96" rx="16" fill="#152235" stroke="#293B52"/>
    <rect x="78" y="241" width="44" height="44" rx="12" fill="#20354B"/>
    <rect x="87" y="251" width="26" height="21" rx="3" stroke="#70A2FF" stroke-width="2"/>
    <path d="M96 278h8m-4-5v5" stroke="#70A2FF" stroke-width="2" stroke-linecap="round"/>
    <text x="137" y="258" fill="#EDF4FF" font-size="16" font-weight="600">Video or webcam</text>
    <text x="137" y="281" fill="#93A5BB" font-size="13">Frames stay on your device</text>

    <rect x="348" y="220" width="225" height="96" rx="16" fill="#152235" stroke="#293B52"/>
    <rect x="368" y="241" width="44" height="44" rx="12" fill="#20354B"/>
    <path d="M380 252h20v4h-20zm0 8h20v4h-20zm0 8h13v4h-13z" fill="#42E8C4"/>
    <text x="427" y="258" fill="#EDF4FF" font-size="16" font-weight="600">Local inference</text>
    <text x="427" y="281" fill="#93A5BB" font-size="13">FastAPI · OpenCV · YOLO</text>

    <rect x="638" y="220" width="225" height="96" rx="16" fill="#152235" stroke="#293B52"/>
    <rect x="658" y="241" width="44" height="44" rx="12" fill="#20354B"/>
    <rect x="668" y="250" width="24" height="26" rx="3" stroke="#70A2FF" stroke-width="2"/>
    <rect x="672" y="255" width="16" height="14" rx="2" stroke="#42E8C4" stroke-width="2"/>
    <text x="717" y="258" fill="#EDF4FF" font-size="16" font-weight="600">Detection overlay</text>
    <text x="717" y="281" fill="#93A5BB" font-size="13">Boxes, counts, and timing</text>

    <path d="M293 268h44m-8-8 8 8-8 8m268-8h44m-8-8 8 8-8 8" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M895 233h246a12 12 0 0 1 12 12v46a12 12 0 0 1-12 12h-246a12 12 0 0 1-12-12v-46a12 12 0 0 1 12-12Z" fill="#102C2C" stroke="#286F68"/>
    <circle cx="910" cy="256" r="4" fill="#42E8C4" filter="url(#glow)"/>
    <text x="925" y="261" fill="#A5F5E2" font-size="12" font-weight="700" letter-spacing="1">NO CLOUD INFERENCE</text>
    <text x="910" y="283" fill="#91B7B1" font-size="12">No account · no API key · no upload</text>
  </g>
</svg>
